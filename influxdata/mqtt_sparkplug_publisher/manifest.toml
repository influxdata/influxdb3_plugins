manifest_schema_version = "1.2"

[plugin]
name = "mqtt_sparkplug_publisher"
version = "0.1.0"
description = "Publishes InfluxDB 3 rows to an MQTT broker as a Sparkplug B Edge Node on write: spBv1.0 topics, Protobuf payloads, NBIRTH/NDATA/NDEATH, bdSeq/seq, aliases, rebirth, STATE and store-and-forward."
triggers = ["process_writes"]
homepage = "https://www.influxdata.com/"
repository = "https://github.com/influxdata/influxdb3_plugins/tree/main/influxdata/mqtt_sparkplug_publisher"
documentation = "https://github.com/influxdata/influxdb3_plugins/blob/main/influxdata/mqtt_sparkplug_publisher/README.md"
exclude = [
  ".git/", ".venv/", "__pycache__/", "*.pyc", "tests/**",
  ".claude/", ".vscode/", ".idea/", ".DS_Store",
  "*.py", "!mqtt_sparkplug_publisher.py",
]

[dependencies]
database_version = ">=3.8.2"
python = [
  "influxdata-plugin-utils>=0.5.0",
  "paho-mqtt>=2.1,<3",
  "protobuf>=5",
]
