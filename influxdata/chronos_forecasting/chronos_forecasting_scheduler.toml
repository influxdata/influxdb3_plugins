# Chronos Forecasting: scheduled trigger configuration template
#
# Name this file in the trigger's config_file_path argument (or in the
# INFLUXDB3_CHRONOS_FORECASTING_CONFIG_FILE_PATH environment variable). A
# relative path is resolved against the plugin directory: the first set of
# PLUGIN_DIR, INFLUXDB3_PLUGIN_DIR and the parent of the engine's virtual
# environment. Example: for /plugins/configs/chronos_forecasting_scheduler.toml
# use config_file_path=configs/chronos_forecasting_scheduler.toml
#
# Keys here override the trigger arguments; an argument this file does not set
# still applies. An unknown key, config_file_path, write_results or
# backtest_points fails every run with bad_request: a scheduled trigger always
# writes and returns no response.
#
# Durations: a whole number and s, min, h, d or w ("30s", "5min", "6h", "7d").

########## What to forecast: source_measurement + field, OR query ##########
# Measurement and numeric field to forecast
source_measurement = "your_measurement"  # e.g., "cpu"
field = "your_field"  # e.g., "usage"

# Instead of source_measurement and field: SQL whose result is forecast. The
# timestamp column must be named time; text columns are series keys and each
# numeric column is forecast on its own. The whole result is read on every run,
# so bound its time range in the query: there is no default window here. A query
# with commas belongs in this file, as the CLI splits --trigger-arguments at
# every comma. Not combined with tag_filter, sql_filter, group_by or
# covariate_fields.
#query = "SELECT date_bin(INTERVAL '5 minutes', time) AS time, host, avg(usage) AS usage FROM cpu WHERE time > now() - INTERVAL '6 hours' GROUP BY 1, host"

# Database to read from. Default: the trigger's database
#source_database = "your_source_database"

########## Horizon: exactly one of the two ##########
# Number of future points at the data spacing, an integer >= 1
horizon_steps = 64
# Or a duration converted to points by the data spacing
#horizon_duration = "1h"

########## Series ##########
# Tags to split by; each distinct combination is its own series, otherwise all
# rows form one. Without sampling_interval, a series mixing tag sets that write
# at the same time is refused. A tag named like a stored row column (field,
# model, forecast, step, ...) is refused. Not with query
#group_by = ["host"]

# SQL condition on tags and fields, without WHERE, AND-ed with tag_filter and
# inserted into the query as is. Not with query
#sql_filter = "usage > 0"

# Forecast only the first N forecasts (series x fields), ordered by the group_by
# tags (or the query's key columns) as text, then by field name; the rest are
# skipped. At most max_series. Default: every series
#series_limit = 5

########## History ##########
# History as a time window ending now; never more points than the model's
# context. Default: point_limit buckets of sampling_interval (at most 365d), or
# 1d of raw points; none with query
#window = "6h"

# History as the most recent cells of each series' grid (buckets with
# sampling_interval), at least 10, at most the model's context.
# Default: 512 when window is not set either
#point_limit = 512

# Resample history to the mean per bucket; empty buckets stay as gaps and the
# bucket still filling is left out. Default: a grid at the median spacing of
# the points
#sampling_interval = "30s"

########## Model and intervals ##########
# HuggingFace model ID: amazon/chronos-bolt-tiny|mini|small|base,
# amazon/chronos-2, an original Chronos model, or a local path.
# Default: amazon/chronos-bolt-tiny
#model = "amazon/chronos-bolt-tiny"

# Interval levels, each between 0 and 1, written as lower_<percent> and
# upper_<percent>; a level the model cannot produce is not written.
# Default: [0.5, 0.8]
#levels = [0.5, 0.8]

# Numeric fields other than field passed to a Chronos-2 model as past
# covariates. Requires a Chronos-2 model; not with query
#covariate_fields = ["humidity", "pressure"]

########## Where the forecast goes ##########
# Default: _forecasts.<source_measurement> in the trigger's database;
# target_measurement is required when query reads several measurements
#target_measurement = "_forecasts.cpu"
#target_database = "your_target_database"

# Tag written to every row, so two triggers that forecast one series with
# different settings (e.g. horizons) keep their own rows. Default: none
#forecast_id = "ops-1h"

########## Limits ##########
# Most forecasts one run may produce (series x fields); more is refused unless
# series_limit keeps fewer. Default: 100
#max_series = 100

# Most forecast points per series; a longer horizon is refused. Default: 1024
#max_forecast_points = 1024

########## Tag filters ##########
# One value or a list of values per tag. Not with query.
# Keep this table LAST: in TOML, keys after a table header belong to that table.
#[tag_filter]
#host = ["server1", "server2"]
#region = "eu"

###### Example: create a trigger using this file ######
# influxdb3 create trigger \
#   --database your_database_name \
#   --path chronos_forecasting.py \
#   --trigger-spec "every:5m" \
#   --trigger-arguments config_file_path=chronos_forecasting_scheduler.toml \
#   your_trigger_name
