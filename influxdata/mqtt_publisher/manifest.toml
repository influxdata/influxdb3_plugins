manifest_schema_version = "1.2"

[plugin]
name = "mqtt_publisher"
version = "0.1.0"
description = "Publishes InfluxDB 3 rows to an MQTT broker on write, on a schedule, or over HTTP for a backfill. JSON, line protocol or template payloads; per-row, per-field or batch; filtering, TLS, buffered queue."
triggers = ["process_writes", "process_scheduled_call", "process_request"]
homepage = "https://www.influxdata.com/"
repository = "https://github.com/influxdata/influxdb3_plugins/tree/main/influxdata/mqtt_publisher"
documentation = "https://github.com/influxdata/influxdb3_plugins/blob/main/influxdata/mqtt_publisher/README.md"
exclude = [
  ".git/", ".venv/", "__pycache__/", "*.pyc", "tests/**",
  ".claude/", ".vscode/", ".idea/", ".DS_Store",
  "*.py", "!mqtt_publisher.py",
]

[dependencies]
database_version = ">=3.8.2"
python = [
  "influxdata-plugin-utils>=0.5.0",
  "paho-mqtt>=2.1,<3",
]
