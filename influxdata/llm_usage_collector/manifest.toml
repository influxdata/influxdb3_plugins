manifest_schema_version = "1.2"

[plugin]
name = "llm_usage_collector"
version = "0.1.0"
description = "Collects organization-wide LLM usage and cost from Anthropic, OpenAI, AWS Bedrock, Azure OpenAI / Microsoft Foundry and Google Vertex AI / Gemini API into InfluxDB 3"
triggers = ["process_scheduled_call", "process_request"]
homepage = "https://www.influxdata.com/"
repository = "https://github.com/influxdata/influxdb3_plugins/tree/main/influxdata/llm_usage_collector"
documentation = "https://github.com/influxdata/influxdb3_plugins/blob/main/influxdata/llm_usage_collector/README.md"
exclude = [
  ".git/", ".venv/", "__pycache__/", "*.pyc", "tests/**",
  ".claude/", ".vscode/", ".idea/", ".DS_Store",
  "*.py", "!llm_usage_collector.py",
]

[dependencies]
database_version = ">=3.8.2"
python = [
  "influxdata-plugin-utils>=0.5.0",
  "requests",
  "boto3",
  "google-auth",
]
