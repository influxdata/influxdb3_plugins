# Prophet Forecasting: scheduled trigger configuration template
#
# Name this file in the trigger's config_file_path argument (or in the
# INFLUXDB3_PROPHET_FORECASTING_CONFIG_FILE_PATH environment variable). A
# relative path is resolved against the plugin directory: the first set of
# PLUGIN_DIR, INFLUXDB3_PLUGIN_DIR and the parent of the engine's virtual
# environment. Example: for /plugins/configs/prophet_forecasting_scheduler.toml
# use config_file_path=configs/prophet_forecasting_scheduler.toml
#
# Keys here override the trigger arguments; an argument this file does not set
# still applies. An unknown key, config_file_path, write_results, backtest_points,
# start_time or end_time fails every run with bad_request: a scheduled trigger
# always writes and returns no response, and its history moves with each run.
#
# Durations: a whole number and us, ms, s, min, h, d, w, m (a month, 30.42 d),
# q (91.25 d) or y (365 d): "500ms", "30s", "5min", "6h", "7d", "3m".

########## What to forecast: source_measurement + field, OR query ##########
# Measurement and numeric field to forecast
source_measurement = "your_measurement"  # e.g., "temperature"
field = "your_field"  # e.g., "value"

# Instead of source_measurement and field: SQL whose result is forecast. The
# timestamp column must be named time; text columns are series keys and each
# numeric column is forecast on its own. The whole result is read on every run,
# so bound its time range in the query. A query with commas belongs in this
# file, as the CLI splits --trigger-arguments at every comma. Not combined with
# tag_filter, sql_filter or group_by.
#query = "SELECT date_bin(INTERVAL '1 hour', time) AS time, room, avg(value) AS value FROM temperature WHERE time > now() - INTERVAL '30 days' GROUP BY 1, room"

# Database to read from. Default: the trigger's database
#source_database = "your_source_database"

########## Horizon: exactly one of the two ##########
# Number of future points, an integer >= 1
horizon_steps = 24
# Or a duration from the last history point, rounded up to whole steps
#horizon_duration = "2d"

########## History: window or point_limit is required, unless query is set ##########
# History as a time window ending now, including validation_window.
window = "30d"

# History as the most recent points of each series (buckets with
# sampling_interval), at least 3. With window, the last points of the window;
# alone, it reads its buckets of sampling_interval (at most 365d) or 30d of raw
# points. Unset: every point of the window, however many; training time grows
# with them.
#point_limit = 2000

# Resample history to the mean per bucket, which is also the forecast step; the
# bucket still filling is left out. Not with forecast_freq. Default: raw points
#sampling_interval = "1h"

# Step of the forecast points as a pandas frequency, fixed ("30min", "1h") or
# calendar ("D", "W-SUN", "MS", "QS", "B"), over the raw points. Not with
# sampling_interval. Default: the frequency pandas infers from the data, or else
# their median spacing
#forecast_freq = "D"

########## Series ##########
# Tags to split by; each distinct combination is its own series with its own
# model, otherwise all rows form one. Without sampling_interval, a series mixing
# tag sets that write at the same time is refused. A tag named like a stored row
# column (field, model, forecast, step, ...) is refused. Not with query
#group_by = ["room"]

# SQL condition on tags and fields, without WHERE, AND-ed with tag_filter and
# inserted into the query as is. Not with query
#sql_filter = "value > 0"

# Forecast only the first N forecasts (series x fields), ordered by the group_by
# tags (or the query's key columns) as text, then by field name; the rest are
# skipped. At most max_series. Default: every series
#series_limit = 5

########## Model ##########
# train fits a new in-memory model on every run. predict loads the model saved
# for unique_suffix and the series, or trains and saves it when there is no file.
# Default: train
#model_mode = "train"

# Model version, part of the saved model's file name: up to 64 characters from
# letters, digits, ".", "_" and "-". Required with model_mode = "predict"
#unique_suffix = "20250619_v1"

# Interval levels, each between 0 and 1, written as lower_<percent> and
# upper_<percent>. Default: [0.5, 0.8]
#levels = [0.5, 0.8]

# "additive" or "multiplicative". Default: "additive"
#seasonality_mode = "additive"

# Flexibility of trend changepoints, a number above 0. Default: 0.05
#changepoint_prior_scale = 0.05

# ISO dates of trend changepoints, in UTC unless they name a timezone; each must
# fall within every series' training history
#changepoints = ["2025-01-01", "2025-06-01"]

# Custom holidays: dates and names, as many of each. A date is in UTC unless it
# names a timezone; a name Prophet reserves, such as trend, is refused
#holiday_date_list = ["2024-12-25", "2025-12-25"]
#holiday_names = ["Christmas", "Christmas"]

# Country code for built-in holidays, refused if Prophet does not know it.
# Prophet supports one country
#holiday_country_names = ["US"]

########## Validation ##########
# Duration held back from training before now. The forecast is compared with the
# measured points there, and a series that fails is not written. Must be shorter
# than window. With sampling_interval it is rounded out to whole buckets, at least
# one. Default: no validation
#validation_window = "3d"

# "position" pairs measured and forecast points in time order; "nearest" pairs
# each measured point with the closest forecast point within half a step.
# Default: "position"
#validation_alignment = "position"

# Highest Mean Squared Relative Error a validated series may have, a number
# >= 0. Default: no limit
#msre_threshold = 0.05

########## Where the forecast goes ##########
# Default: _forecasts.<source_measurement> in the trigger's database;
# target_measurement is required when query reads several measurements
#target_measurement = "_forecasts.temperature"
#target_database = "your_target_database"

# Tag written to every row, so two triggers that forecast one series with
# different settings (e.g. horizons) keep their own rows. Default: none
#forecast_id = "ops-1h"

########## Limits ##########
# Most forecasts one run may produce (series x fields); more is refused unless
# series_limit keeps fewer. Default: 100
#max_series = 100

# Most forecast points per series, counting the validation window; a longer
# horizon is refused. Default: 10000
#max_forecast_points = 10000

########## Alerts on failed validation ##########
# One alert per run, listing the series that failed
#is_sending_alert = true
#senders = ["slack"]  # slack, discord, http, sms, whatsapp
#notification_path = "notify"  # URL path of the notifier plugin
#port_override = 8181

# Template. Variables: $version, $measurement, $field, $series, $start_time,
# $end_time, $output_measurement
#notification_text = "Validation failed on table:$measurement, field:$field. Series: $series"

# Secret: only in this file or the environment, never a trigger argument.
# Default: the INFLUXDB3_AUTH_TOKEN environment variable
#influxdb3_auth_token = "your_token"

#slack_webhook_url = "https://hooks.slack.com/services/..."
#slack_headers = "base64_encoded_headers"
#discord_webhook_url = "https://discord.com/api/webhooks/..."
#discord_headers = "base64_encoded_headers"
#http_webhook_url = "https://example.com/webhook"
#http_headers = "base64_encoded_headers"
#twilio_sid = "your_twilio_sid"
# Secret, like influxdb3_auth_token; unset, the notifier reads its own TWILIO_TOKEN
#twilio_token = "your_twilio_token"
#twilio_to_number = "+1234567890"
#twilio_from_number = "+19876543210"

########## Tag filters ##########
# One value or a list of values per tag. Not with query.
# Keep this table LAST: in TOML, keys after a table header belong to that table.
#[tag_filter]
#room = ["Kitchen", "Lounge"]
#site = "eu"

###### Example: create a trigger using this file ######
# influxdb3 create trigger \
#   --database your_database_name \
#   --path prophet_forecasting.py \
#   --trigger-spec "every:1h" \
#   --trigger-arguments config_file_path=prophet_forecasting_scheduler.toml \
#   your_trigger_name
